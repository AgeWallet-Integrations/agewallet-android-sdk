name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer run on the same branch or pull request cancels the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    # Runs on the organisation repo only, never on personal forks.
    if: github.repository == 'AgeWallet-Integrations/agewallet-android-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # example/ is the build with a committed Gradle wrapper; it includes the library from ../agewallet-sdk
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      - name: Library unit tests and lint, and the demo app's debug build
        run: ./gradlew --no-daemon :agewallet-sdk:testDebugUnitTest :agewallet-sdk:lintDebug :app:assembleDebug

      # Test counts from the JUnit XML reports, written to the run summary
      - name: Test summary
        if: always()
        working-directory: agewallet-sdk/build/test-results/testDebugUnitTest
        run: |
          cat *.xml | grep -o '<testsuite [^>]*' | awk '
            { for (i = 1; i <= NF; i++) if (split($i, kv, "=") == 2) { gsub(/"/, "", kv[2]); n[kv[1]] += kv[2] } }
            END { printf "### Unit tests\n\n%d tests, %d failures, %d errors, %d skipped\n", n["tests"], n["failures"], n["errors"], n["skipped"] }
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            agewallet-sdk/build/reports/
          if-no-files-found: ignore
